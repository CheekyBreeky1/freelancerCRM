          readOnly: true
          
    Task:
      type: object
      required:
        - id
        - title
        - currency
        - priority
        - status
        - payment
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Уникальный идентификатор задачи (nanoid)
          example: "fghte53Cf3"
          readOnly: true
        employerId:
          type: string
          nullable: true
          description: Идентификатор заказчика. null — задача без заказчика
          example: "ABC123de45"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Сделать лендинг"
        currency:
          type: string
          enum:
            - RUB
            - EUR
            - USD
          default: RUB
          description: Валюта задачи. Если не передана — берётся из UserPreferences.defaultCurrency
          example: RUB
        priority:
          type: string
          enum:
            - low
            - medium
            - high
          default: medium
          example: medium
        priorityWeight:
          type: integer
          readOnly: true
          description: |
            Числовой вес приоритета для сортировки: low=0, medium=1, high=2.
            Вычисляется сервером, не принимается от клиента.
          example: 1
        status:
          type: string
          enum:
            - progress
            - review
            - done
            - paid
          default: progress
          example: progress
        statusWeight:
          type: integer
          readOnly: true
          description: |
            Числовой вес статуса для сортировки: progress=0, review=1, done=2, paid=3.
            Вычисляется сервером, не принимается от клиента.
          example: 0
        description:
          type: string
          maxLength: 5000
          nullable: true
          example: "Заказчик предпочитает синие тона"
        payment:
          type: number
          minimum: 0
          default: 0
          description: Оплата в валюте задачи. 0 — если не указана
          example: 4500
        deadline:
          type: string
          format: date
          nullable: true
          description: Дедлайн в формате YYYY-MM-DD
          example: "2026-10-08"
        subTasks:
          type: array
          description: >
            Подпункты задачи. Присутствует в GET /tasks/:id, POST /tasks и PATCH /tasks/:id.
            В GET /tasks (список) отсутствует.
          items:
            $ref: '#/components/schemas/SubTask'
        createdAt:
          type: string
          format: date-time
          example: "2026-10-08T12:00:00Z"
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-08T12:00:00Z"
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
          readOnly: true
          
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: >
                Машиночитаемый код ошибки. Используется клиентом для обработки
                (например, чтобы отличить TOKEN_EXPIRED от UNAUTHORIZED).
              example: "VALIDATION_ERROR"
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - TOKEN_EXPIRED
                - NOT_FOUND
                - CONFLICT
                - EMAIL_TAKEN
            message:
              type: string
              description: Человекочитаемое описание ошибки (для разработчика, не для UI)
              example: "Невалидные данные"
            details:
              type: array
              description: Детали валидации — какие поля не прошли проверку. Присутствует только для VALIDATION_ERROR
              items:
                type: object
                required:
                  - field
                  - reason
                properties:
                  field:
                    type: string
                    description: Имя поля, в котором ошибка
                    example: "status"
                  reason:
                    type: string
                    description: >
                      Причина ошибки в snake_case. Например, invalid_value,
                      not_unique, null_or_empty, too_long, not_found
                    example: "invalid_value"
                    
